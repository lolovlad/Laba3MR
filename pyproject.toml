[project]
name = "laba3mr"
version = "0.1.0"
description = "Mini recommendation MLOps project for lab #3"
authors = [
    {name = "lolovlad",email = "lolovlad39@gmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.116.1,<0.117.0",
    "uvicorn>=0.35.0,<0.36.0",
    "scikit-learn>=1.7.1,<1.8.0",
    "pandas>=2.3.2,<2.4.0",
    "numpy>=2.3.3,<2.4.0",
    "joblib>=1.5.2,<1.6.0",
    "dvc[s3]>=3.61.0,<4.0.0",
    "boto3>=1.40.17,<1.41.0",
    "pydantic>=2.12.0,<3.0.0"
]

[tool.poetry.group.dev.dependencies]
black = "^25.1.0"
flake8 = "^7.1.1"
pytest = "^8.3.3"
httpx = "^0.27.2"
notebook = "^7.4.5"

[tool.poetry]
package-mode = false


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
