version: "3.9"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laba3_app
    ports:
      - "8000:8000"
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
      - DVC_S3_ENDPOINT_URL=http://minio:9000
    depends_on:
      minio:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    command: >
      sh -c "poetry run python -m src.data.generate_data &&
      poetry run python -m src.ml.train &&
      poetry run uvicorn src.app.main:app --host 0.0.0.0 --port 8000"

  minio:
    image: minio/minio:latest
    container_name: laba3_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:latest
    container_name: laba3_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 2; done &&
      mc mb -p local/recommender-dvc || true &&
      mc anonymous set none local/recommender-dvc || true
      "
    restart: "no"
